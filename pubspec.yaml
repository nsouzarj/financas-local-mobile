name: financas_local
description: "Aplicativo móvel do Finanças App 100% Offline com SQLite local e sistema de backup preventivo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Banco de Dados Local SQLite e Gerenciamento de Caminhos
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  
  # Autenticação Biométrica e Armazenamento Seguro
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  
  # Utilitários e Formatação
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
